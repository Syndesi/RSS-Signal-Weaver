[project]
name = "signalweaver"
version = "0.1.0"
requires-python = ">=3.13"

dependencies = [
    "prefect>=2.16",
    "feedparser",
    "langdetect",
    "structlog",
    "marimo",
    "numpy",
    "pandas",
    "pydantic>=2.12.5",
]

[dependency-groups]
dev = [
    "pip>=26.0.1",
    "pytest",
    "ruff",
    "ty"
]

[tool.ruff]
target-version = "py38"
extend-exclude = [
    "crates/ty_vendored/vendor/",
    "crates/ruff/resources/",
    "crates/ruff_linter/resources/",
    "crates/ruff_python_formatter/resources/",
    "crates/ruff_python_parser/resources/",
    "crates/ruff_python_semantic/resources/"
]

[tool.ruff.lint]
select = [
    "E", # pycodestyle (error)
    "F", # pyflakes
    "B", # bugbear
    "B9",
    "C4", # flake8-comprehensions
    "SIM", # flake8-simplify
    "I", # isort
    "UP", # pyupgrade
    "PIE", # flake8-pie
    "PGH", # pygrep-hooks
    "PYI", # flake8-pyi
    "RUF",
    "S602", # flake8-bandit: subprocess-popen-with-shell-equals-true
]

ignore = [
    # Leave it to the formatter to split long lines and
    # the judgement of all of us.
    "E501"
]

[tool.ruff.lint.isort]
required-imports = ["from __future__ import annotations"]
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
"notebooks/**.py" = ["B018"]
